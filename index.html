<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E9EDF0;
  --surface: #FFFFFF;
  --ink: #16222E;
  --muted: #55656F;
  --line: #C9D2D9;
  --chip: #DDE5EA;
  --accent: #F2B705;
  --accent-ink: #16222E;
  --danger: #B3261E;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181E;
    --surface: #1C252E;
    --ink: #ECF0F3;
    --muted: #93A2AF;
    --line: #2E3A45;
    --chip: #27323C;
    --danger: #FF8A80;
  }
}
:root[data-theme="dark"] {
  --bg: #12181E;
  --surface: #1C252E;
  --ink: #ECF0F3;
  --muted: #93A2AF;
  --line: #2E3A45;
  --chip: #27323C;
  --danger: #FF8A80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 120px;
}
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.05; }
h1 { font-size: 40px; }
h2 { font-size: 28px; }
p { margin: 0; }
.top { margin-bottom: 20px; }
.sub { color: var(--muted); margin-top: 4px; }
.notice {
  background: var(--chip);
  border-left: 4px solid var(--danger);
  padding: 10px 12px;
  margin-bottom: 16px;
  border-radius: 6px;
}
.empty {
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 20px 16px;
  margin-bottom: 16px;
  color: var(--muted);
}
.card, .picker, .hcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.last { color: var(--muted); font-size: 15px; margin: 6px 0 14px; }
.sets { list-style: none; margin: 0 0 14px; padding: 0; }
.sets li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.sets .desc { font-size: 18px; }
.num { font-family: var(--display); font-weight: 700; font-size: 26px; }
.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.field label, .picker label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 4px; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.stepper input {
  flex: 1;
  min-width: 0;
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--display);
  font-weight: 700;
  font-size: 32px;
  text-align: center;
  padding: 0;
  -moz-appearance: textfield;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.step {
  width: 52px;
  min-height: 56px;
  border: 0;
  background: var(--chip);
  color: var(--ink);
  font-family: var(--display);
  font-weight: 700;
  font-size: 30px;
  cursor: pointer;
}
.step:active { background: var(--line); }
.btn {
  display: block;
  width: 100%;
  min-height: 54px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-family: var(--body);
  font-weight: 600;
  font-size: 18px;
  cursor: pointer;
  margin-bottom: 12px;
  padding: 0 16px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.inline { width: auto; margin: 0; }
.btn.small { min-height: 40px; font-size: 15px; width: auto; margin: 0; padding: 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip {
  min-height: 48px;
  padding: 0 16px;
  border-radius: 24px;
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
}
.hint { color: var(--muted); margin: 8px 0; }
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.row input {
  flex: 1;
  min-width: 0;
  min-height: 54px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
}
.hcard ul { list-style: none; padding: 0; margin: 10px 0 12px; }
.hcard li { padding: 8px 0; border-top: 1px solid var(--line); }
.hcard li strong { display: block; font-weight: 600; }
.hcard li span { color: var(--muted); }
.confirm { background: var(--chip); border-radius: 10px; padding: 12px; margin-top: 8px; }
.confirm p { margin-bottom: 10px; }
.confirm .btn:last-child { margin-bottom: 0; }
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs button {
  flex: 1;
  min-height: 60px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: var(--display);
  font-weight: 700;
  font-size: 24px;
  cursor: pointer;
  border-top: 4px solid transparent;
}
.tabs button[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 24px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  max-width: 90%;
  text-align: center;
}
.toast.show { opacity: 1; }
button:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.stepper input:focus-visible { outline-offset: -3px; }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Main">
  <button type="button" data-act="tab" data-view="log" id="tab-log">Log</button>
  <button type="button" data-act="tab" data-view="history" id="tab-history">History</button>
</nav>

<script>
(function () {
  var KEY = 'workout-log-v1';
  var memOnly = false;
  var view = 'log';
  var picking = false;
  var confirmDiscard = false;
  var confirmDeleteId = null;
  var toastTimer = null;

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');

  function load() {
    var empty = { exercises: [], workouts: [], draft: null };
    try {
      localStorage.setItem(KEY + '-test', '1');
      localStorage.removeItem(KEY + '-test');
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        return {
          exercises: Array.isArray(d.exercises) ? d.exercises : [],
          workouts: Array.isArray(d.workouts) ? d.workouts : [],
          draft: d.draft && Array.isArray(d.draft.items) ? d.draft : null
        };
      }
    } catch (e) {
      memOnly = true;
    }
    return empty;
  }

  var state = load();

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      if (!memOnly) { memOnly = true; render(); }
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function fmtDate(s) {
    var p = String(s).split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(d.getTime())) return s;
    return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function fmtNum(n) {
    n = Number(n) || 0;
    return String(Math.round(n * 100) / 100);
  }

  function setText(s) {
    return (s.w > 0 ? fmtNum(s.w) + ' kg × ' : '') + s.r + (s.r === 1 ? ' rep' : ' reps');
  }

  function fmtSets(sets) {
    var groups = [];
    sets.forEach(function (s) {
      var g = groups[groups.length - 1];
      if (g && g.w === s.w && g.r === s.r) { g.n++; }
      else { groups.push({ w: s.w, r: s.r, n: 1 }); }
    });
    return groups.map(function (g) {
      var core = g.n + ' × ' + g.r;
      return g.w > 0 ? core + ' @ ' + fmtNum(g.w) + ' kg' : core;
    }).join(', ');
  }

  function lastTime(name) {
    for (var i = 0; i < state.workouts.length; i++) {
      var w = state.workouts[i];
      for (var j = 0; j < w.items.length; j++) {
        var it = w.items[j];
        if (it.name === name && it.sets.length) return { date: w.date, sets: it.sets };
      }
    }
    return null;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2500);
  }

  function addToDraft(name) {
    if (!state.draft) state.draft = { date: todayStr(), items: [] };
    var exists = state.draft.items.some(function (x) { return x.name === name; });
    if (!exists) {
      var last = lastTime(name);
      var lastSet = last ? last.sets[last.sets.length - 1] : null;
      state.draft.items.push({
        name: name,
        w: lastSet ? lastSet.w : 0,
        r: lastSet ? lastSet.r : 10,
        sets: []
      });
    }
    picking = false;
    save();
    render();
  }

  function card(it, i) {
    var last = lastTime(it.name);
    var lastLine = last
      ? 'Last time (' + esc(fmtDate(last.date)) + '): ' + esc(fmtSets(last.sets))
      : 'First time logging this exercise.';
    var h = '<section class="card"><h2>' + esc(it.name) + '</h2><p class="last">' + lastLine + '</p>';
    if (it.sets.length) {
      h += '<ol class="sets">';
      it.sets.forEach(function (s, k) {
        h += '<li><span class="desc"><span class="num">' + (k + 1) + '</span> &nbsp;' + esc(setText(s)) + '</span>' +
          '<button type="button" class="btn ghost small" data-act="remove-set" data-i="' + i + '" data-s="' + k + '" aria-label="Remove set ' + (k + 1) + '">Remove</button></li>';
      });
      h += '</ol>';
    }
    h += '<div class="inputs">' +
      '<div class="field"><label for="w-' + i + '">Weight (kg)</label><div class="stepper">' +
      '<button type="button" class="step" data-act="step" data-i="' + i + '" data-f="w" data-d="-2.5" aria-label="Decrease weight">−</button>' +
      '<input id="w-' + i + '" type="number" inputmode="decimal" step="any" min="0" data-f="w" data-i="' + i + '" value="' + fmtNum(it.w) + '">' +
      '<button type="button" class="step" data-act="step" data-i="' + i + '" data-f="w" data-d="2.5" aria-label="Increase weight">+</button></div></div>' +
      '<div class="field"><label for="r-' + i + '">Reps</label><div class="stepper">' +
      '<button type="button" class="step" data-act="step" data-i="' + i + '" data-f="r" data-d="-1" aria-label="Decrease reps">−</button>' +
      '<input id="r-' + i + '" type="number" inputmode="numeric" step="1" min="0" data-f="r" data-i="' + i + '" value="' + fmtNum(it.r) + '">' +
      '<button type="button" class="step" data-act="step" data-i="' + i + '" data-f="r" data-d="1" aria-label="Increase reps">+</button></div></div>' +
      '</div>';
    h += '<button type="button" class="btn primary" data-act="add-set" data-i="' + i + '">Add set</button>';
    if (!it.sets.length) {
      h += '<button type="button" class="btn ghost" data-act="remove-exercise" data-i="' + i + '">Remove exercise</button>';
    }
    h += '</section>';
    return h;
  }

  function availableExercises() {
    var inDraft = {};
    (state.draft ? state.draft.items : []).forEach(function (x) { inDraft[x.name] = true; });
    return state.exercises.filter(function (n) { return !inDraft[n]; });
  }

  function picker() {
    var avail = availableExercises();
    var h = '<section class="picker"><h2>Add exercise</h2>';
    if (avail.length) {
      h += '<p class="hint">Pick one of your exercises:</p><div class="chips">';
      avail.forEach(function (n) {
        h += '<button type="button" class="chip" data-act="pick" data-name="' + esc(n) + '">' + esc(n) + '</button>';
      });
      h += '</div>';
    } else {
      h += '<p class="hint">Your exercise list is empty. Type a name to add your first exercise.</p>';
    }
    h += '<label for="new-ex">New exercise name</label>' +
      '<div class="row"><input id="new-ex" type="text" placeholder="e.g. Bench press" maxlength="60" autocomplete="off">' +
      '<button type="button" class="btn primary inline" data-act="add-new">Add</button></div>' +
      '<button type="button" class="btn ghost" data-act="close-picker">Cancel</button></section>';
    return h;
  }

  function logView() {
    var d = state.draft;
    var items = d ? d.items : [];
    var h = '<header class="top"><h1>Today\'s workout</h1><p class="sub">' + esc(fmtDate(d ? d.date : todayStr())) + '</p></header>';
    if (!items.length && !picking) {
      h += '<section class="empty"><p>No exercises yet. Add your first exercise to start logging sets.</p></section>';
    }
    items.forEach(function (it, i) { h += card(it, i); });
    if (picking) {
      h += picker();
    } else {
      h += '<button type="button" class="btn secondary" data-act="open-picker">Add exercise</button>';
    }
    var hasSets = items.some(function (it) { return it.sets.length; });
    if (hasSets && !picking) {
      h += '<button type="button" class="btn primary" data-act="save-workout">Save workout</button>';
    }
    if (items.length && !picking) {
      if (confirmDiscard) {
        h += '<div class="confirm"><p>Discard this workout? The sets you entered today won\'t be saved.</p>' +
          '<button type="button" class="btn danger" data-act="discard-yes">Discard workout</button>' +
          '<button type="button" class="btn ghost" data-act="discard-no">Keep workout</button></div>';
      } else {
        h += '<button type="button" class="btn ghost" data-act="discard">Discard workout</button>';
      }
    }
    return h;
  }

  function historyView() {
    var n = state.workouts.length;
    var h = '<header class="top"><h1>History</h1><p class="sub">' +
      (n === 0 ? 'Nothing saved yet' : n + (n === 1 ? ' workout saved' : ' workouts saved')) + '</p></header>';
    if (n === 0) {
      h += '<section class="empty"><p>No workouts saved yet. Log a workout and tap Save workout to see it here.</p></section>';
    }
    state.workouts.forEach(function (w) {
      h += '<article class="hcard"><h2>' + esc(fmtDate(w.date)) + '</h2><ul>';
      w.items.forEach(function (it) {
        h += '<li><strong>' + esc(it.name) + '</strong><span>' + esc(fmtSets(it.sets)) + '</span></li>';
      });
      h += '</ul>';
      if (confirmDeleteId === w.id) {
        h += '<div class="confirm"><p>Delete this workout? This can\'t be undone.</p>' +
          '<button type="button" class="btn danger" data-act="delete-yes" data-id="' + esc(w.id) + '">Delete workout</button>' +
          '<button type="button" class="btn ghost" data-act="delete-no">Keep workout</button></div>';
      } else {
        h += '<button type="button" class="btn ghost small" data-act="delete" data-id="' + esc(w.id) + '">Delete workout</button>';
      }
      h += '</article>';
    });
    return h;
  }

  function render() {
    var notice = memOnly
      ? '<p class="notice">Saving isn\'t available in this browser window, so your log will be lost when you close this page.</p>'
      : '';
    app.innerHTML = notice + (view === 'log' ? logView() : historyView());
    document.getElementById('tab-log').setAttribute('aria-current', view === 'log' ? 'page' : 'false');
    document.getElementById('tab-history').setAttribute('aria-current', view === 'history' ? 'page' : 'false');
    if (view === 'log' && picking && availableExercises().length === 0) {
      var f = document.getElementById('new-ex');
      if (f) f.focus();
    }
  }

  function addNewFromInput() {
    var input = document.getElementById('new-ex');
    if (!input) return;
    var name = input.value.trim();
    if (!name) { showToast('Type an exercise name first'); return; }
    var existing = state.exercises.filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
    if (existing) {
      name = existing;
    } else {
      state.exercises.push(name);
    }
    addToDraft(name);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    var items = state.draft ? state.draft.items : [];
    var i = b.dataset.i !== undefined ? +b.dataset.i : -1;

    if (act === 'tab') {
      view = b.dataset.view;
      picking = false;
      confirmDiscard = false;
      confirmDeleteId = null;
      render();
      window.scrollTo(0, 0);
    } else if (act === 'open-picker') {
      picking = true; render();
    } else if (act === 'close-picker') {
      picking = false; render();
    } else if (act === 'pick') {
      addToDraft(b.dataset.name);
    } else if (act === 'add-new') {
      addNewFromInput();
    } else if (act === 'step') {
      var it = items[i];
      if (!it) return;
      var f = b.dataset.f;
      var v = (parseFloat(it[f]) || 0) + parseFloat(b.dataset.d);
      v = Math.max(0, Math.round(v * 100) / 100);
      it[f] = v;
      document.getElementById(f + '-' + i).value = fmtNum(v);
      save();
    } else if (act === 'add-set') {
      var item = items[i];
      if (!item) return;
      var w = parseFloat(item.w) || 0;
      var r = parseFloat(item.r) || 0;
      if (r < 1) { showToast('Enter at least 1 rep'); return; }
      item.sets.push({ w: w, r: r });
      save();
      render();
    } else if (act === 'remove-set') {
      if (items[i]) { items[i].sets.splice(+b.dataset.s, 1); save(); render(); }
    } else if (act === 'remove-exercise') {
      if (items[i]) {
        items.splice(i, 1);
        if (!items.length) state.draft = null;
        save(); render();
      }
    } else if (act === 'save-workout') {
      var kept = items.filter(function (x) { return x.sets.length; }).map(function (x) {
        return { name: x.name, sets: x.sets };
      });
      if (!kept.length) return;
      state.workouts.unshift({ id: uid(), date: state.draft.date, items: kept });
      state.draft = null;
      view = 'history';
      save();
      render();
      window.scrollTo(0, 0);
      showToast('Workout saved');
    } else if (act === 'discard') {
      confirmDiscard = true; render();
    } else if (act === 'discard-no') {
      confirmDiscard = false; render();
    } else if (act === 'discard-yes') {
      state.draft = null; confirmDiscard = false; picking = false;
      save(); render();
      showToast('Workout discarded');
    } else if (act === 'delete') {
      confirmDeleteId = b.dataset.id; render();
    } else if (act === 'delete-no') {
      confirmDeleteId = null; render();
    } else if (act === 'delete-yes') {
      var id = b.dataset.id;
      state.workouts = state.workouts.filter(function (w) { return w.id !== id; });
      confirmDeleteId = null;
      save(); render();
      showToast('Workout deleted');
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.f && t.dataset.i !== undefined && state.draft) {
      var it = state.draft.items[+t.dataset.i];
      if (!it) return;
      var v = parseFloat(t.value);
      it[t.dataset.f] = isNaN(v) ? 0 : Math.max(0, v);
      save();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'new-ex' && e.key === 'Enter') {
      e.preventDefault();
      addNewFromInput();
    }
  });

  render();
})();
</script>
</body>
</html>
